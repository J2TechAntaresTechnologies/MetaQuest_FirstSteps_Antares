# Curso 1
## Panorama WebXR e Industria

Duración: 2 horas — Nivel: Introductorio

---

## Objetivos
- Entender VR/AR/MR, WebXR, OpenXR
- Ver capacidades y límites de hardware (Quest 3)
- Casos de uso industriales
- Roadmap de adopción y gobernanza

---

## Ecosistema XR
- VR, AR, MR y tracking 6DoF
- Hand tracking y controladores
- Passthrough y MR

--

### WebXR en el navegador
- Estándar W3C
- Emulación (IWER/DevUI)
- Pruebas sin visor

---

## WebXR vs Nativo (OpenXR)
- Velocidad de prototipado vs rendimiento máximo
- Acceso hardware, APIs y distribución
- Casos: web pública, intranet, kioskos

---

## Hardware (Meta Quest 3)
- Resolución y tasa de refresco
- Ergonomía y confort
- Wi‑Fi 6/6E, uso en red local

---

## Casos de uso (Industria)
- Formación y SOPs 3D
- Mantenimiento remoto
- Gemelos digitales e indicadores
- Planificación de layout

---

## Seguridad y gobernanza
- Permisos, privacidad, datos sensibles
- Certificados y HTTPS en LAN
- MDM/Quest for Business

---

## Roadmap de adopción
- Identificar 1–2 pilotos
- KPIs de valor y telemetría
- Despliegue y soporte
